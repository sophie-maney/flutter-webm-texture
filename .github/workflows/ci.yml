name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FVM_HOME: ${{ github.workspace }}/.fvm_home

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fvm
        run: |
          curl -fsSL https://fvm.app/install.sh | bash
          echo "$HOME/fvm/bin" >> "$GITHUB_PATH"

      - name: Cache fvm SDK
        uses: actions/cache@v4
        with:
          path: ${{ env.FVM_HOME }}
          key: fvm-${{ runner.os }}-${{ hashFiles('.fvmrc') }}

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install pinned Flutter
        run: fvm install

      - run: fvm flutter pub get
      # Spike B app (T0.8) is a separate Flutter app; analyze needs its deps.
      - run: fvm flutter pub get
        working-directory: example/spike_b
      # Spike C app (T0.9), same reason.
      - run: fvm flutter pub get
        working-directory: example/spike_c
      - run: fvm dart format --set-exit-if-changed .
      - run: fvm flutter analyze
      - run: fvm flutter test

      # Pinned so CI and local runs format identically (brew/pip: 23.1.5).
      - name: clang-format
        run: |
          git ls-files 'src/*.cc' 'src/*.h' 'native_test/*.cc' 'native_test/*.c' 'native_test/*.h' 'fuzz/*.cc' 'android/src/main/cpp/*.cc' 'android/src/main/cpp/*.h' |
            xargs -r pipx run clang-format==23.1.5 --dry-run -Werror

  native:
    name: Native host tests (${{ matrix.os }}, ASan + UBSan)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # zlib reads the gzipped reference frames in the host tests (ADR 0001).
      - name: Install nasm and zlib
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm zlib1g-dev

      # Release builds of the deps plus the GoogleTest sources, keyed on
      # everything that decides their contents.
      - name: Cache host deps
        id: deps
        uses: actions/cache@v4
        with:
          path: build/deps/host-core/prefix
          key: host-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('third_party/versions.lock', 'third_party/test-deps.lock', 'third_party/build/common.sh', 'tool/build_host_deps.sh') }}

      - name: Build host deps
        if: steps.deps.outputs.cache-hit != 'true'
        run: tool/build_host_deps.sh

      - name: Configure
        run: cmake -S . -B build/host -DWT_HOST_TESTS=ON -DWT_SANITIZE=ON -DWT_WERROR=ON

      - name: Build
        run: cmake --build build/host -j 4

      - name: Test
        env:
          ASAN_OPTIONS: abort_on_error=1:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/host --output-on-failure

      - name: Fuzz build
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build/fuzz -DWT_FUZZ=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DWT_WERROR=ON
          cmake --build build/fuzz -j 4

      # 60 s per target, all targets in parallel. The nightly run in
      # fuzz-nightly.yml goes for 30 min.
      - name: Fuzz smoke (60 s)
        if: runner.os == 'Linux'
        run: tool/fuzz.sh 60

      - name: Upload fuzz findings
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings-pr
          path: |
            build/fuzz/artifacts/
            build/fuzz/logs/
          if-no-files-found: ignore

  android:
    name: Example APK (debug)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install fvm
        run: |
          curl -fsSL https://fvm.app/install.sh | bash
          echo "$HOME/fvm/bin" >> "$GITHUB_PATH"

      - name: Cache fvm SDK
        uses: actions/cache@v4
        with:
          path: ${{ env.FVM_HOME }}
          key: fvm-${{ runner.os }}-${{ hashFiles('.fvmrc') }}

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: fvm install
      - run: fvm flutter pub get
      - name: Fetch native prebuilts
        run: fvm dart run tool/fetch_prebuilts.dart --platform android
      - name: Build debug APK
        working-directory: example
        run: fvm flutter build apk --debug

  ios:
    name: Example iOS simulator build (debug)
    needs: check
    runs-on: macos-latest
    defaults:
      run:
        working-directory: webm_texture
    steps:
      # SwiftPM derives the package identity from the directory name, which must
      # match the plugin name rather than the repository name.
      - uses: actions/checkout@v4
        with:
          path: webm_texture

      - name: Install fvm
        run: |
          curl -fsSL https://fvm.app/install.sh | bash
          echo "$HOME/fvm/bin" >> "$GITHUB_PATH"

      - name: Cache fvm SDK
        uses: actions/cache@v4
        with:
          path: ${{ env.FVM_HOME }}
          key: fvm-${{ runner.os }}-${{ hashFiles('webm_texture/.fvmrc') }}

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('webm_texture/**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - run: fvm install
      - run: fvm flutter pub get
      - name: Fetch native prebuilts
        run: fvm dart run tool/fetch_prebuilts.dart --platform ios
      - name: Build debug simulator app
        working-directory: webm_texture/example
        run: fvm flutter build ios --simulator --debug --no-codesign

  # Screenshot goldens in example/integration_test/goldens/ were recorded on a
  # 1080x2400 Pixel 6 profile (Android) and an iPhone 17 simulator (iOS); keep
  # the devices below in sync, or the golden size check fails. Re-record with
  # the command at the top of example/integration_test/app_test.dart.
  integration-android:
    name: Integration tests (Android emulator)
    timeout-minutes: 30
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install fvm
        run: |
          curl -fsSL https://fvm.app/install.sh | bash
          echo "$HOME/fvm/bin" >> "$GITHUB_PATH"

      - name: Cache fvm SDK
        uses: actions/cache@v4
        with:
          path: ${{ env.FVM_HOME }}
          key: fvm-${{ runner.os }}-${{ hashFiles('.fvmrc') }}

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: fvm install
      - run: fvm flutter pub get
      - name: Fetch native prebuilts
        run: fvm dart run tool/fetch_prebuilts.dart --platform android

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: example
          script: fvm flutter test integration_test/all_test.dart -d emulator-5554

  integration-ios:
    name: Integration tests (iOS simulator)
    timeout-minutes: 30
    needs: check
    runs-on: macos-latest
    defaults:
      run:
        working-directory: webm_texture
    steps:
      - uses: actions/checkout@v4
        with:
          path: webm_texture

      - name: Install fvm
        run: |
          curl -fsSL https://fvm.app/install.sh | bash
          echo "$HOME/fvm/bin" >> "$GITHUB_PATH"

      - name: Cache fvm SDK
        uses: actions/cache@v4
        with:
          path: ${{ env.FVM_HOME }}
          key: fvm-${{ runner.os }}-${{ hashFiles('webm_texture/.fvmrc') }}

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('webm_texture/**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - run: fvm install
      - run: fvm flutter pub get
      - name: Fetch native prebuilts
        run: fvm dart run tool/fetch_prebuilts.dart --platform ios

      - name: Boot an iPhone 17 simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name == "iPhone 17")][0].udid')
          test "$UDID" != null || { echo "no iPhone 17 simulator on this runner"; exit 1; }
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run integration tests
        working-directory: webm_texture/example
        timeout-minutes: 25
        # One app launch for every test (all_test.dart). On GitHub's macOS
        # runners the simulator sometimes never starts the app, or the Dart
        # Development Service fails to start, so allow three attempts with a
        # limit each.
        run: |
          for attempt in 1 2 3; do
            echo "attempt $attempt"
            if perl -e 'alarm shift; exec @ARGV' 420 \
              fvm flutter test integration_test/all_test.dart -d "$SIM_UDID" --reporter expanded; then
              exit 0
            fi
          done
          echo "::error::integration tests failed 3 attempts"
          exit 1
