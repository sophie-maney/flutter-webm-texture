# Regenerate with: fvm dart run ffigen --config ffigen.yaml
# Needs libclang (macOS: brew install llvm).
name: WtBindings
description: dart:ffi bindings for src/api/wt_api.h (the core's only C ABI).
output: lib/src/gen/wt_bindings.g.dart
llvm-path:
  - /opt/homebrew/opt/llvm
  - /usr/local/opt/llvm
  - /usr/lib/llvm-18
  - /usr/lib/llvm-17
headers:
  entry-points:
    - src/api/wt_api.h
  include-directives:
    - src/api/wt_api.h
preamble: |
  // ignore_for_file: type=lint
  // GENERATED by ffigen from src/api/wt_api.h; do not edit by hand.
comments:
  style: any
  length: full
functions:
  include:
    - wt_.*
structs:
  include:
    - wt_.*
enums:
  include:
    - wt_.*
unnamed-enums:
  include:
    - WT_.*
macros:
  include:
    - WT_.*
typedefs:
  include:
    - wt_.*
