# Pinned third-party sources for the native prebuilts.
#
# This is the only place versions and checksums live (see AGENTS.md). Bump a
# library by editing its row and rerunning the prebuilt workflow; every build
# script fetches through third_party/build/common.sh, which refuses any source
# whose sha256 does not match.
#
# Columns are whitespace-separated:
#   name     library id (also the source directory name under build/deps/src)
#   version  upstream release; for git sources, the full commit id
#   sha256   sha256 of the downloaded tarball. For git sources it is the sha256
#            of `git archive --format=tar --prefix=<name>/ <commit>`, which is
#            deterministic for a given commit.
#   url      tarball URL, or git+<repo URL> for git sources
#
# libyuv has no releases or stable tarballs (googlesource +archive tarballs are
# regenerated on every request), so it is pinned to a commit on main.
# libyuv commit 9e8c1ef826ea1f6cc624855555c36c4d38e72818 is LIBYUV_VERSION 1980.

